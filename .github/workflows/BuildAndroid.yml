name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET 11 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Verify .NET SDK
        run: dotnet --info

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Install Android SDK dependencies
        run: |
          dotnet build CavernSamples/CavernizeAndroid/CavernizeAndroid.csproj \
            -t:InstallAndroidDependencies -f net11.0-android -c Release \
            -p:AcceptAndroidSDKLicenses=true

      - name: Restore persistent signing keystore
        run: |
          base64 -d .github/signing/cavernize.keystore.b64 > "$GITHUB_WORKSPACE/cavernize.p12"
          keytool -importkeystore \
            -srckeystore "$GITHUB_WORKSPACE/cavernize.p12" -srcstoretype PKCS12 -srcstorepass cavernize \
            -destkeystore "$GITHUB_WORKSPACE/cavernize.keystore" -deststoretype PKCS12 -deststorepass cavernize \
            -destkeypass cavernize -noprompt
          keytool -list -v -keystore "$GITHUB_WORKSPACE/cavernize.keystore" -storepass cavernize | head -n 25

      - name: Build native ARM64 libcavernize_proaudio.so (Path A AAudio + Path B libusb UAC2)
        id: ndk_build
        continue-on-error: true
        run: |
          set -euo pipefail
          NDK_LOG="$RUNNER_TEMP/ci_00_ndk.log"
          : > "$NDK_LOG"
          exec > >(tee -a "$NDK_LOG") 2>&1

          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          echo "Using Android NDK: ${NDK_DIR:-<none>}"
          if [ -z "$NDK_DIR" ] || [ ! -f "$NDK_DIR/build/cmake/android.toolchain.cmake" ]; then
            echo "Warning: Android NDK toolchain not found; skipping native pro-audio build (AudioTrack fallback stays active)."
            exit 0
          fi

          WORK_DIR="$RUNNER_TEMP/cavernize_proaudio_build"
          rm -rf "$WORK_DIR" && mkdir -p "$WORK_DIR"

          LIBUSB_CMAKE_ARG=""
          if curl -fsSL "https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2" -o "$WORK_DIR/libusb.tar.bz2"; then
            tar -xjf "$WORK_DIR/libusb.tar.bz2" -C "$WORK_DIR"
            LIBUSB_SRC=$(find "$WORK_DIR" -maxdepth 1 -type d -name "libusb-*" | head -n 1)
            if [ -n "$LIBUSB_SRC" ]; then
              LIBUSB_CMAKE_ARG="-DLIBUSB_ROOT=$LIBUSB_SRC"
              echo "Bundling unrooted Android libusb from: $LIBUSB_SRC"
            fi
          else
            echo "Warning: Could not download libusb-1.0.27 tarball; compiling Path A AAudio Exclusive only."
          fi

          cmake -S "CavernSamples/CavernizeAndroid/Native/cavernize_proaudio" \
            -B "$WORK_DIR/cmake_arm64" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            $LIBUSB_CMAKE_ARG
          cmake --build "$WORK_DIR/cmake_arm64" --config Release -- -j"$(nproc)"

          mkdir -p "CavernSamples/CavernizeAndroid/NativeLibs/arm64-v8a"
          cp "$WORK_DIR/cmake_arm64/libcavernize_proaudio.so" "CavernSamples/CavernizeAndroid/NativeLibs/arm64-v8a/libcavernize_proaudio.so"
          ls -lh "CavernSamples/CavernizeAndroid/NativeLibs/arm64-v8a/libcavernize_proaudio.so"

      - name: Bundle W^X NativeLibs (libffmpeg.so, libtruehdd.so, libonnxruntime.so) & verify 16 KB ELF alignment
        run: |
          set -euo pipefail
          NAT_LOG="$RUNNER_TEMP/ci_00b_nativelibs.log"
          : > "$NAT_LOG"
          exec > >(tee -a "$NAT_LOG") 2>&1
          python3 - << 'PY'
          import hashlib, io, json, os, pathlib, re, shutil, struct, subprocess, tarfile, urllib.error, urllib.request, xml.etree.ElementTree as ET, zipfile

          native_dir = pathlib.Path("CavernSamples/CavernizeAndroid/NativeLibs/arm64-v8a")
          assets_dir = pathlib.Path("CavernSamples/CavernizeAndroid/Assets")
          native_dir.mkdir(parents=True, exist_ok=True)
          (assets_dir / "ffmpeg").mkdir(parents=True, exist_ok=True)
          (assets_dir / "truehdd").mkdir(parents=True, exist_ok=True)
          (assets_dir / "onnxruntime").mkdir(parents=True, exist_ok=True)

          def http_get(url, timeout=90):
              headers = {"User-Agent": "CavernizeCI/2.9"}
              tok = os.environ.get("GITHUB_TOKEN")
              if tok and "api.github.com" in url:
                  headers["Authorization"] = f"Bearer {tok}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  return resp.read()

          # 1. FFmpeg (16 KB ELF aligned standalone PIE executable libffmpeg.so, Android API 24+)
          ff_tag = "native-ffmpeg-8.1.3-r1"
          try:
              rels = json.loads(http_get("https://api.github.com/repos/mzgs/FFmpegX-Android/releases?per_page=10", 30))
              for r in rels:
                  t = r.get("tag_name", "")
                  if t.startswith("native-ffmpeg-") and any(a.get("name") == "ffmpeg-android.tar.gz" for a in r.get("assets", [])):
                      ff_tag = t
                      break
          except Exception as ex:
              print(f"FFmpeg release lookup fallback ({ex}); using {ff_tag}")

          rel_meta = json.loads(http_get(f"https://github.com/mzgs/FFmpegX-Android/releases/download/{ff_tag}/native-release.json", 30))
          ff_url = rel_meta["url"]
          ff_sha = rel_meta["sha256"].strip().lower()
          print(f"Downloading FFmpeg ({ff_tag}) from {ff_url}...")
          ff_tar_bytes = http_get(ff_url, 180)
          actual_sha = hashlib.sha256(ff_tar_bytes).hexdigest().lower()
          assert actual_sha == ff_sha, f"FFmpeg SHA256 mismatch: {actual_sha} != {ff_sha}"
          with tarfile.open(fileobj=io.BytesIO(ff_tar_bytes), mode="r:gz") as tf:
              ff_member = tf.getmember("jniLibs/arm64-v8a/libffmpeg_exec.so")
              (native_dir / "libffmpeg.so").write_bytes(tf.extractfile(ff_member).read())
              for m in tf.getmembers():
                  if m.isfile() and m.name == "assets/ffmpeg-licenses/ffmpeg/LICENSE.md":
                      (assets_dir / "ffmpeg" / "LICENSE.md").write_bytes(tf.extractfile(m).read())
          ver_m = re.search(r"native-ffmpeg-([0-9.]+)", ff_tag)
          ff_ver = ver_m.group(1) if ver_m else ff_tag
          (assets_dir / "ffmpeg" / "version.txt").write_text(ff_ver + "\n", encoding="utf-8")
          print(f"Bundled libffmpeg.so ({(native_dir / 'libffmpeg.so').stat().st_size} bytes, v{ff_ver})")

          # 2. truehdd (static musl ARM64 executable -> libtruehdd.so, 64 KB LOAD aligned)
          th_ver = "0.6.3"
          th_url = f"https://github.com/truehdd/truehdd/releases/download/{th_ver}/truehdd-{th_ver}-aarch64-unknown-linux-musl.tar.gz"
          th_sha_url = th_url + ".sha256"
          try:
              th_rel = json.loads(http_get("https://api.github.com/repos/truehdd/truehdd/releases/latest", 30))
              th_ver = (th_rel.get("tag_name") or th_ver).lstrip("vV")
              for a in th_rel.get("assets", []):
                  nm = a.get("name", "")
                  if nm.endswith("aarch64-unknown-linux-musl.tar.gz"):
                      th_url = a["browser_download_url"]
                  elif nm.endswith("aarch64-unknown-linux-musl.tar.gz.sha256"):
                      th_sha_url = a["browser_download_url"]
          except Exception as ex:
              print(f"truehdd release lookup fallback ({ex}); using {th_ver}")

          print(f"Downloading truehdd ({th_ver}) from {th_url}...")
          th_tar_bytes = http_get(th_url, 120)
          try:
              expected_th_sha = http_get(th_sha_url, 30).decode("utf-8").strip().split()[0].lower()
              actual_th_sha = hashlib.sha256(th_tar_bytes).hexdigest().lower()
              assert actual_th_sha == expected_th_sha, f"truehdd SHA256 mismatch: {actual_th_sha} != {expected_th_sha}"
          except urllib.error.HTTPError:
              pass
          with tarfile.open(fileobj=io.BytesIO(th_tar_bytes), mode="r:gz") as tf:
              found_bin = False
              for m in tf.getmembers():
                  if not m.isfile():
                      continue
                  base = os.path.basename(m.name)
                  if base == "truehdd":
                      (native_dir / "libtruehdd.so").write_bytes(tf.extractfile(m).read())
                      found_bin = True
                  elif base in ("LICENSE", "NOTICE"):
                      (assets_dir / "truehdd" / base).write_bytes(tf.extractfile(m).read())
              assert found_bin, "truehdd binary missing from archive"
          (assets_dir / "truehdd" / "version.txt").write_text(th_ver + "\n", encoding="utf-8")
          print(f"Bundled libtruehdd.so ({(native_dir / 'libtruehdd.so').stat().st_size} bytes, v{th_ver})")

          # 3. ONNX Runtime (Prefer Maven Central onnxruntime-android-qnn for Snapdragon Hexagon NPU QNN HTP,
          #    auto-falling back to standard onnxruntime-android if QNN AAR is unavailable or fails 16 KB ELF alignment)
          def check_elf_16k_bytes(raw_bytes):
              if len(raw_bytes) < 64 or raw_bytes[:4] != b"\x7fELF" or raw_bytes[4] != 2:
                  return False
              e_phoff = struct.unpack_from("<Q", raw_bytes, 32)[0]
              e_phentsize, e_phnum = struct.unpack_from("<HH", raw_bytes, 54)
              found_load = False
              for pi in range(e_phnum):
                  off = e_phoff + pi * e_phentsize
                  if off + 56 > len(raw_bytes):
                      return False
                  p_type = struct.unpack_from("<I", raw_bytes, off)[0]
                  if p_type == 1:  # PT_LOAD
                      found_load = True
                      p_align = struct.unpack_from("<Q", raw_bytes, off + 48)[0]
                      if p_align < 16384:
                          return False
              return found_load

          ort_ver = "1.32.0"
          ort_variant = "onnxruntime-android"
          ort_bundled = False
          for artifact in ("onnxruntime-android-qnn", "onnxruntime-android"):
              ort_base = f"https://repo1.maven.org/maven2/com/microsoft/onnxruntime/{artifact}"
              cand_ver = ort_ver
              try:
                  xml_bytes = http_get(f"{ort_base}/maven-metadata.xml", 30)
                  root = ET.fromstring(xml_bytes)
                  cand_ver = (root.findtext(".//release") or root.findtext(".//latest") or cand_ver).strip()
                  ort_url = f"{ort_base}/{cand_ver}/{artifact}-{cand_ver}.aar"
                  print(f"Downloading ONNX Runtime ({artifact} {cand_ver}) from {ort_url}...")
                  ort_aar = http_get(ort_url, 180)
                  extracted_sos = {}
                  extracted_hdr = None
                  extracted_lic = None
                  with zipfile.ZipFile(io.BytesIO(ort_aar)) as zf:
                      for name in zf.namelist():
                          norm = name.replace("\\", "/")
                          if norm.startswith("jni/arm64-v8a/") and norm.endswith(".so"):
                              base = os.path.basename(norm)
                              if not base or base == "libonnxruntime4j_jni.so":
                                  continue
                              extracted_sos[base] = zf.read(name)
                          elif norm == "headers/onnxruntime_c_api.h" or norm.endswith("/onnxruntime_c_api.h"):
                              extracted_hdr = zf.read(name)
                          elif norm in ("LICENSE", "LICENSE.txt") or norm.endswith("/LICENSE"):
                              extracted_lic = zf.read(name)
                  if "libonnxruntime.so" not in extracted_sos or not extracted_hdr:
                      print(f"Skipping {artifact} {cand_ver}: missing libonnxruntime.so or onnxruntime_c_api.h")
                      continue
                  bad_align = [b for b, data in extracted_sos.items() if not check_elf_16k_bytes(data)]
                  if bad_align and artifact == "onnxruntime-android-qnn":
                      print(f"Skipping {artifact} {cand_ver}: non-16KB-aligned libraries {bad_align}; falling back to standard onnxruntime-android")
                      continue
                  for b, data in extracted_sos.items():
                      (native_dir / b).write_bytes(data)
                  (assets_dir / "onnxruntime" / "onnxruntime_c_api.h").write_bytes(extracted_hdr)
                  if extracted_lic:
                      (assets_dir / "onnxruntime" / "LICENSE.txt").write_bytes(extracted_lic)
                  ort_ver = cand_ver
                  ort_variant = artifact
                  ort_bundled = True
                  break
              except Exception as ex:
                  print(f"ONNX Runtime artifact {artifact} failed ({ex}); trying fallback...")
          assert ort_bundled, "Failed to download valid ONNX Runtime AAR"
          (assets_dir / "onnxruntime" / "version.txt").write_text(f"{ort_ver}\n", encoding="utf-8")
          print(f"Bundled {ort_variant} libonnxruntime.so ({(native_dir / 'libonnxruntime.so').stat().st_size} bytes, v{ort_ver})")

          # 3b. Validate onnxruntime_c_api.h parses cleanly with OnnxRuntimeHeaderParser anchor rules
          ort_hdr_text = (assets_dir / "onnxruntime" / "onnxruntime_c_api.h").read_text(encoding="utf-8", errors="ignore")
          ort_no_cmt = re.sub(r"/\*.*?\*/", " ", ort_hdr_text, flags=re.S)
          ort_no_cmt = re.sub(r"//[^\n]*", "", ort_no_cmt)
          ort_no_cmt = ort_no_cmt.replace("\\\r\n", " ").replace("\\\n", " ")
          android_defs = {"__ANDROID__", "ANDROID", "__linux__", "__unix__", "__aarch64__", "__LP64__"}
          pp_lines, pp_stack, pp_active = [], [], True
          for ln in ort_no_cmt.splitlines():
              tr = ln.lstrip()
              if tr.startswith("#"):
                  d = tr[1:].lstrip()
                  if re.match(r"ifdef\s+", d):
                      sym = re.match(r"ifdef\s+([A-Za-z_][A-Za-z0-9_]*)", d).group(1)
                      c = sym in android_defs
                      pp_stack.append([pp_active, pp_active and c, c]); pp_active = pp_active and c
                  elif re.match(r"ifndef\s+", d):
                      sym = re.match(r"ifndef\s+([A-Za-z_][A-Za-z0-9_]*)", d).group(1)
                      c = sym not in android_defs
                      pp_stack.append([pp_active, pp_active and c, c]); pp_active = pp_active and c
                  elif re.match(r"if(\s+|\()", d):
                      expr = d[2:].strip()
                      expr = re.sub(r"\bdefined\s*\(\s*([A-Za-z_][A-Za-z0-9_]*)\s*\)", lambda m: "1" if m.group(1) in android_defs else "0", expr)
                      expr = re.sub(r"\bdefined\s+([A-Za-z_][A-Za-z0-9_]*)\b", lambda m: "1" if m.group(1) in android_defs else "0", expr)
                      expr = re.sub(r"\b([A-Za-z_][A-Za-z0-9_]*)\b", lambda m: "1" if m.group(1) in android_defs else "0", expr)
                      expr = expr.replace("&&", " and ").replace("||", " or ").replace("!", " not ")
                      try: c = bool(eval(expr, {"__builtins__": {}}, {}))
                      except Exception: c = False
                      pp_stack.append([pp_active, pp_active and c, c]); pp_active = pp_active and c
                  elif re.match(r"elif(\s+|\()", d) and pp_stack:
                      parent_act, _, taken = pp_stack[-1]
                      c = False
                      if not taken:
                          expr = d[4:].strip()
                          expr = re.sub(r"\bdefined\s*\(\s*([A-Za-z_][A-Za-z0-9_]*)\s*\)", lambda m: "1" if m.group(1) in android_defs else "0", expr)
                          expr = re.sub(r"\b([A-Za-z_][A-Za-z0-9_]*)\b", lambda m: "1" if m.group(1) in android_defs else "0", expr)
                          expr = expr.replace("&&", " and ").replace("||", " or ").replace("!", " not ")
                          try: c = bool(eval(expr, {"__builtins__": {}}, {}))
                          except Exception: c = False
                      pp_active = parent_act and c; pp_stack[-1] = [parent_act, pp_active, taken or c]
                  elif re.match(r"else(\b|$)", d) and pp_stack:
                      parent_act, _, taken = pp_stack[-1]
                      pp_active = parent_act and (not taken); pp_stack[-1] = [parent_act, pp_active, True]
                  elif re.match(r"endif(\b|$)", d) and pp_stack:
                      pp_active = pp_stack.pop()[0]
                  elif pp_active and d.startswith("define") and "ORT_API_VERSION" in d:
                      pp_lines.append(tr)
              elif pp_active:
                  pp_lines.append(ln)
          pp_text = "\n".join(pp_lines)
          sm = re.search(r"\bstruct\s+OrtApi\s*\{", pp_text)
          assert sm, "struct OrtApi not found in onnxruntime_c_api.h"
          ob = pp_text.index("{", sm.start()); depth = 0; cb = -1
          for idx_c in range(ob, len(pp_text)):
              if pp_text[idx_c] == "{": depth += 1
              elif pp_text[idx_c] == "}":
                  depth -= 1
                  if depth == 0: cb = idx_c; break
          assert cb > ob, "Unbalanced braces in struct OrtApi"
          body = pp_text[ob + 1:cb]
          stmts, cur, pd, bd = [], [], 0, 0
          for ch in body:
              if ch == "(": pd += 1
              elif ch == ")" and pd > 0: pd -= 1
              elif ch == "{": bd += 1
              elif ch == "}" and bd > 0: bd -= 1
              if ch == ";" and pd == 0 and bd == 0:
                  s = "".join(cur).strip()
                  if s: stmts.append(s)
                  cur = []
              else:
                  cur.append(ch)
          macro_re = re.compile(r"\b(ORT_CLASS_RELEASE|ORT_API2_STATUS|ORT_API_STATUS|ORT_API_T|ORT_API)\s*\(")
          raw_re = re.compile(r"\(\s*(?:[A-Za-z0-9_]+\s*)*\*\s*([A-Za-z_][A-Za-z0-9_]*)\s*\)\s*\(")
          ort_slots = {}
          slot_i = 0
          for st in stmts:
              if not st or st.startswith("#"): continue
              sym = None
              mm = macro_re.search(st)
              if mm:
                  op = st.index("(", mm.start()); d2 = 0; cp = -1
                  for j in range(op, len(st)):
                      if st[j] == "(": d2 += 1
                      elif st[j] == ")":
                          d2 -= 1
                          if d2 == 0: cp = j; break
                  if cp > op:
                      inner = st[op + 1:cp]
                      args, a0, pd2 = [], 0, 0
                      for j, ch in enumerate(inner):
                          if ch == "(": pd2 += 1
                          elif ch == ")" and pd2 > 0: pd2 -= 1
                          elif ch == "," and pd2 == 0:
                              args.append(inner[a0:j].strip()); a0 = j + 1
                      args.append(inner[a0:].strip())
                      mac = mm.group(1)
                      tok = args[0] if mac in ("ORT_CLASS_RELEASE", "ORT_API2_STATUS", "ORT_API_STATUS") else (args[1] if len(args) >= 2 else "")
                      idm = re.search(r"([A-Za-z_][A-Za-z0-9_]*)[^A-Za-z0-9_]*$", tok)
                      if idm:
                          sym = ("Release" + idm.group(1)) if mac == "ORT_CLASS_RELEASE" else idm.group(1)
              if not sym:
                  rm = raw_re.search(st)
                  if rm: sym = rm.group(1)
              if sym:
                  ort_slots[sym] = slot_i; slot_i += 1
          assert ort_slots.get("CreateStatus") == 0, f"Bad CreateStatus slot: {ort_slots.get('CreateStatus')}"
          assert ort_slots.get("GetErrorCode") == 1, f"Bad GetErrorCode slot: {ort_slots.get('GetErrorCode')}"
          assert ort_slots.get("GetErrorMessage") == 2, f"Bad GetErrorMessage slot: {ort_slots.get('GetErrorMessage')}"
          assert ort_slots.get("CreateEnv") == 3, f"Bad CreateEnv slot: {ort_slots.get('CreateEnv')}"
          for req_sym in ("CreateSession", "Run", "GetTensorElementType", "SessionGetInputTypeInfo", "CastTypeInfoToTensorInfo", "ReleaseSession", "ReleaseStatus"):
              assert req_sym in ort_slots, f"Missing required OrtApi slot '{req_sym}' in onnxruntime_c_api.h"
          print(f"Verified onnxruntime_c_api.h OrtApi vtable: {len(ort_slots)} symbols (CreateStatus=0, CreateEnv=3, CreateSession={ort_slots['CreateSession']}, Run={ort_slots['Run']}, GetTensorElementType={ort_slots['GetTensorElementType']})")

          # 4. Verify required binaries, ELF64 AArch64 headers, 16 KB PT_LOAD alignment, and non-stripped exports
          required = ["libcavernize_proaudio.so", "libffmpeg.so", "libtruehdd.so", "libonnxruntime.so"]
          for req_name in required:
              assert (native_dir / req_name).is_file(), f"Missing required native binary: {native_dir / req_name}"

          ndk_dir = os.environ.get("ANDROID_NDK_LATEST_HOME") or os.environ.get("ANDROID_NDK_HOME") or os.environ.get("ANDROID_NDK_ROOT") or ""
          if not ndk_dir or not os.path.isdir(ndk_dir):
              cands = sorted(pathlib.Path("/usr/local/lib/android/sdk/ndk").glob("*")) if os.path.isdir("/usr/local/lib/android/sdk/ndk") else []
              ndk_dir = str(cands[-1]) if cands else ""
          llvm_bin = pathlib.Path(ndk_dir) / "toolchains/llvm/prebuilt/linux-x86_64/bin" if ndk_dir else None
          objdump = str(llvm_bin / "llvm-objdump") if llvm_bin and (llvm_bin / "llvm-objdump").is_file() else "objdump"
          readelf = str(llvm_bin / "llvm-readelf") if llvm_bin and (llvm_bin / "llvm-readelf").is_file() else "readelf"
          nm_bin = str(llvm_bin / "llvm-nm") if llvm_bin and (llvm_bin / "llvm-nm").is_file() else "nm"

          for so_path in sorted(native_dir.glob("*.so")):
              raw = so_path.read_bytes()
              assert raw[:4] == b"\x7fELF" and raw[4] == 2 and raw[5] == 1, f"{so_path.name}: not 64-bit LE ELF"
              e_type, e_machine, _, _, e_phoff, _, _, _, e_phentsize, e_phnum = struct.unpack_from("<HHIQQQIHHH", raw, 16)
              assert e_machine == 183, f"{so_path.name}: expected EM_AARCH64 (183), got {e_machine}"
              assert e_type in (2, 3), f"{so_path.name}: unexpected ELF e_type={e_type}"
              loads = []
              for i in range(e_phnum):
                  p_type, _, p_offset, p_vaddr, _, _, p_memsz, p_align = struct.unpack_from("<IIQQQQQQ", raw, e_phoff + i * e_phentsize)
                  if p_type == 1:
                      assert p_align >= 16384, f"{so_path.name}: PT_LOAD align {hex(p_align)} < 0x4000 (16 KB)"
                      assert (p_offset - p_vaddr) % 16384 == 0, f"{so_path.name}: PT_LOAD offset/vaddr delta not 16 KB aligned"
                      loads.append(hex(p_align))
              assert loads, f"{so_path.name}: no PT_LOAD segments"
              od_out = subprocess.check_output([objdump, "-p", str(so_path)], text=True, stderr=subprocess.STDOUT)
              load_lines = [ln.strip() for ln in od_out.splitlines() if "LOAD" in ln]
              print(f"OK {so_path.name} ({len(raw)} bytes, type={e_type}, aligns={loads}):")
              for ln in load_lines:
                  print(f"   {ln}")

          # Verify shared library dynamic exports are unstripped for P/Invoke & NativeLibrary.GetExport
          pa_syms = subprocess.check_output([nm_bin, "-D", str(native_dir / "libcavernize_proaudio.so")], text=True)
          assert "cavernize_pa_get_version" in pa_syms, "libcavernize_proaudio.so stripped of cavernize_pa_get_version!"
          ort_syms = subprocess.check_output([nm_bin, "-D", str(native_dir / "libonnxruntime.so")], text=True)
          assert "OrtGetApiBase" in ort_syms, "libonnxruntime.so stripped of OrtGetApiBase!"
          print("All NativeLibs/arm64-v8a binaries verified 16 KB ELF aligned and unstripped.")
          PY

      - name: Full multi-layer compile check & consolidated error report
        id: compile_check
        env:
          NDK_OUTCOME: ${{ steps.ndk_build.outcome }}
        run: |
          set +e
          SHADOW_CSPROJ="CavernSamples/CavernizeAndroid/CavernizeAndroid.ShadowAudit.csproj"
          trap 'rm -f "$SHADOW_CSPROJ"' EXIT

          dotnet restore CavernSamples/CavernizeAndroid/CavernizeAndroid.csproj -p:AcceptAndroidSDKLicenses=true

          LAYERS=(
            "01_Cavern|Cavern/Cavern.csproj|-c Release -v:minimal -p:GenerateFullPaths=true"
            "02_Cavern.Format|Cavern.Format/Cavern.Format.csproj|-c Release -v:minimal -p:GenerateFullPaths=true"
            "03_Cavernize.Logic|CavernSamples/Reusable/Cavernize.Logic/Cavernize.Logic.csproj|-c Release -v:minimal -p:GenerateFullPaths=true"
            "04_CavernizeAndroid|CavernSamples/CavernizeAndroid/CavernizeAndroid.csproj|-c Release -f net11.0-android -v:minimal -p:GenerateFullPaths=true -p:AcceptAndroidSDKLicenses=true -p:ApplicationVersion=${{ github.run_number }} -p:ApplicationDisplayVersion=2.9.${{ github.run_number }}"
          )

          STATUS_FILE="$RUNNER_TEMP/ci_layer_status.txt"
          : > "$STATUS_FILE"
          UPSTREAM_FAILED=0

          for entry in "${LAYERS[@]}"; do
            IFS='|' read -r name proj args <<< "$entry"
            log="$RUNNER_TEMP/ci_${name}.log"
            : > "$log"
            if [ "$UPSTREAM_FAILED" -eq 1 ]; then
              echo "$name|SKIPPED_UPSTREAM|0" >> "$STATUS_FILE"
              continue
            fi
            echo "=== Building $name ($proj) ==="
            # shellcheck disable=SC2086
            dotnet build "$proj" $args --no-restore 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then
              echo "$name|PASS|0" >> "$STATUS_FILE"
            else
              echo "$name|FAIL|$rc" >> "$STATUS_FILE"
              UPSTREAM_FAILED=1
            fi
          done

          # If an upstream layer failed before 04_CavernizeAndroid could compile, run an All-In-One
          # Shadow Roslyn compilation combining unbuilt upstream .cs sources directly into net11.0-android
          # so ALL errors across the ENTIRE app (including CavernizeAndroid) are surfaced in ONE run.
          SHADOW_LOG="$RUNNER_TEMP/ci_05_Shadow_FullApp.log"
          : > "$SHADOW_LOG"
          if grep -q "04_CavernizeAndroid|SKIPPED_UPSTREAM" "$STATUS_FILE"; then
            echo "=== Upstream layer failed; running All-In-One Shadow Roslyn Audit for entire app ==="
            python3 - "$STATUS_FILE" "$SHADOW_CSPROJ" << 'PYGEN'
          import sys

          status_file, out_csproj = sys.argv[1], sys.argv[2]
          statuses = {}
          for line in open(status_file, encoding="utf-8"):
              parts = line.strip().split("|")
              if len(parts) == 3:
                  statuses[parts[0]] = parts[1]

          refs = []
          compiles = []

          if statuses.get("01_Cavern") == "PASS":
              refs.append('    <ProjectReference Include="../../Cavern/Cavern.csproj" />')
          else:
              compiles.append('    <Compile Include="../../Cavern/**/*.cs" Exclude="../../Cavern/obj/**;../../Cavern/bin/**" />')
              compiles.append('    <Compile Include="../VoidX.WPF/Language/LanguageBase.cs" Link="Shadow/VoidX.WPF/Language/LanguageBase.cs" />')
              compiles.append('    <Compile Include="../VoidX.WPF/Language/LanguageSettings.cs" Link="Shadow/VoidX.WPF/Language/LanguageSettings.cs" />')

          if statuses.get("02_Cavern.Format") == "PASS":
              refs.append('    <ProjectReference Include="../../Cavern.Format/Cavern.Format.csproj" />')
          else:
              compiles.append('    <Compile Include="../../Cavern.Format/**/*.cs" Exclude="../../Cavern.Format/obj/**;../../Cavern.Format/bin/**" />')

          if statuses.get("03_Cavernize.Logic") == "PASS":
              refs.append('    <ProjectReference Include="../Reusable/Cavernize.Logic/Cavernize.Logic.csproj" />')
          else:
              compiles.append('    <Compile Include="../Reusable/Cavernize.Logic/**/*.cs" Exclude="../Reusable/Cavernize.Logic/obj/**;../Reusable/Cavernize.Logic/bin/**" />')
              compiles.append('    <Compile Include="../VoidX.WPF/FFmpeg/FFmpeg.cs" Link="Shadow/VoidX.WPF/FFmpeg/FFmpeg.cs" />')
              compiles.append('    <Compile Include="../VoidX.WPF/FFmpeg/FFmpegArgument.cs" Link="Shadow/VoidX.WPF/FFmpeg/FFmpegArgument.cs" />')
              compiles.append('    <Compile Include="../VoidX.WPF/FFmpeg/FFmpegConfigurator.cs" Link="Shadow/VoidX.WPF/FFmpeg/FFmpegConfigurator.cs" />')
              compiles.append('    <Compile Include="../VoidX.WPF/FFmpeg/FFmpegStream.cs" Link="Shadow/VoidX.WPF/FFmpeg/FFmpegStream.cs" />')
              compiles.append('    <Compile Include="../VoidX.WPF/HTTP.cs" Link="Shadow/VoidX.WPF/HTTP.cs" />')

          xml = f"""<Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net11.0-android</TargetFramework>
              <SupportedOSPlatformVersion>26.0</SupportedOSPlatformVersion>
              <OutputType>Exe</OutputType>
              <Nullable>disable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
              <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
              <ApplicationId>hu.sbence.cavern.cavernize</ApplicationId>
              <AndroidUseAapt2>true</AndroidUseAapt2>
              <DefaultItemExcludes>$(DefaultItemExcludes);obj/**;bin/**</DefaultItemExcludes>
            </PropertyGroup>
            <ItemGroup>
          {chr(10).join(compiles)}
            </ItemGroup>
            <ItemGroup>
          {chr(10).join(refs)}
            </ItemGroup>
          </Project>
          """
          with open(out_csproj, "w", encoding="utf-8") as f:
              f.write(xml)
          PYGEN

            dotnet build "$SHADOW_CSPROJ" \
              -c Release -f net11.0-android -v:minimal \
              -p:GenerateFullPaths=true \
              -p:AcceptAndroidSDKLicenses=true \
              -p:BaseIntermediateOutputPath="$RUNNER_TEMP/shadow_obj/" \
              -p:BaseOutputPath="$RUNNER_TEMP/shadow_bin/" \
              2>&1 | tee "$SHADOW_LOG"
            shadow_rc=${PIPESTATUS[0]}
            if [ "$shadow_rc" -eq 0 ]; then
              echo "05_Shadow_FullApp|PASS|0" >> "$STATUS_FILE"
            else
              echo "05_Shadow_FullApp|FAIL|$shadow_rc" >> "$STATUS_FILE"
            fi
          fi

          python3 - "$RUNNER_TEMP" "$NDK_OUTCOME" "$GITHUB_STEP_SUMMARY" << 'PY'
          import os, re, sys

          runner_temp, ndk_outcome, summary_path = sys.argv[1], sys.argv[2], sys.argv[3]
          status_path = os.path.join(runner_temp, "ci_layer_status.txt")
          layers = []
          if os.path.exists(status_path):
              for line in open(status_path, encoding="utf-8"):
                  parts = line.strip().split("|")
                  if len(parts) == 3:
                      layers.append(tuple(parts))

          err_pat = re.compile(r"(?::\s*error\b|\berror\s+[A-Z]{2,}[0-9]+:|\bfatal error:)", re.I)
          global_seen = set()
          all_errors = []

          def normalize_key(line):
              # Deduplicate identical diagnostics reported by both a layer build and the shadow all-in-one build
              return re.sub(r"\s*\[[^\]]+\.csproj\]\s*$", "", line).strip()

          def collect(label, log_file):
              if not os.path.exists(log_file):
                  return []
              found = []
              for raw in open(log_file, encoding="utf-8", errors="ignore"):
                  line = raw.strip()
                  if err_pat.search(line):
                      key = normalize_key(line)
                      if key not in global_seen:
                          global_seen.add(key)
                          found.append(line)
              if found:
                  all_errors.append((label, found))
              return found

          collect("00_Native_NDK", os.path.join(runner_temp, "ci_00_ndk.log"))
          for name, st, _ in layers:
              collect(name, os.path.join(runner_temp, f"ci_{name}.log"))

          failed = (ndk_outcome != "success") or any(st == "FAIL" for _, st, _ in layers)
          lines = []
          lines.append("## Cavernize CI Multi-Layer Build Report")
          lines.append(f"- **00_Native_NDK**: `{ndk_outcome.upper()}`")
          for name, st, _ in layers:
              lines.append(f"- **{name}**: `{st}`")

          if all_errors:
              total = sum(len(errs) for _, errs in all_errors)
              lines.append(f"\n### Consolidated Errors ({total} unique across entire app)")
              for label, errs in all_errors:
                  lines.append(f"\n#### {label} ({len(errs)})")
                  lines.append("```text")
                  lines.extend(errs)
                  lines.append("```")
          elif not failed:
              lines.append("\nAll native NDK and C# layers compiled with **0 errors**.")

          report = "\n".join(lines) + "\n"
          print("\n================ ALL CI ERRORS SUMMARY ================")
          print(report)
          print("=======================================================")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as sf:
                  sf.write(report)
          sys.exit(1 if failed else 0)
          PY

      - name: Build and sign CavernizeAndroid APK
        id: apk_publish
        run: |
          set -euo pipefail
          PUB_LOG="$RUNNER_TEMP/ci_06_publish.log"
          : > "$PUB_LOG"
          dotnet publish CavernSamples/CavernizeAndroid/CavernizeAndroid.csproj \
            -c Release -f net11.0-android \
            -p:GenerateFullPaths=true \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:ApplicationDisplayVersion=2.9.${{ github.run_number }} \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$GITHUB_WORKSPACE/cavernize.keystore" \
            -p:AndroidSigningKeyAlias=cavernize \
            -p:AndroidSigningKeyPass=cavernize \
            -p:AndroidSigningStorePass=cavernize \
            -p:AcceptAndroidSDKLicenses=true 2>&1 | tee "$PUB_LOG"

      - name: Collect signed APK
